services:
  m3tal-webui:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webui.rule=Host(`dash.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.webui.entrypoints=web"
      - "traefik.http.services.webui.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"
