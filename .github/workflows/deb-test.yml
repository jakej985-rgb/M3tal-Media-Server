name: DEB Test Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deb-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Binary
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/m3tal ./cmd/m3tal

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Create nfpm config
        run: |
          cat <<EOF > nfpm.yaml
          name: m3tal-core
          arch: amd64
          platform: linux
          version: 0.0.0-test
          maintainer: Jake Johnson
          description: Test build
          contents:
            - src: ./dist/m3tal
              dst: /usr/bin/m3tal
          EOF

      - name: Build .deb
        run: nfpm package --packager deb --config nfpm.yaml --target dist/
