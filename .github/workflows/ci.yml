name: M3TAL Control Plane CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Opt into Node.js 24 as requested by GitHub Actions deprecation notice
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-go-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./source/go-backend
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        # Fix: tell setup-go where the dependencies are for caching
        cache-dependency-path: source/go-backend/go.sum
    - name: Go Format
      run: go fmt ./...
    - name: Go Vet
      run: go vet ./...
    - name: Go Build
      run: go build ./...

  test-python-cli:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Create dummy .env
      run: echo "DASHBOARD_SECRET=dummy_secret" > .env
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r source/dashboard/requirements.txt
    - name: Verify CLI script
      run: python m3tal.py --help
    - name: Verify CLI Up dry run
      run: python m3tal.py up --help

  test-python-cli-windows:
    # Notice: windows-2025 is redirected, so we use windows-latest (standard)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Create dummy .env
      run: echo "DASHBOARD_SECRET=dummy_secret" > .env
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r source/dashboard/requirements.txt
    - name: Verify CLI script on Windows
      run: python m3tal.py --help

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install Lint Tools
      run: pip install flake8
    - name: Lint — syntax errors and undefined names
      # Fix: Exclude vendor and virtualenv folders to prevent external library errors
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=vendor,venv,.venv,scratch
    - name: Lint — style warnings
      run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=vendor,venv,.venv,scratch

  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Lint shell scripts
      uses: ludeeus/action-shellcheck@master
      with:
        scandir: '.'
        # Fix: Use ignore_paths as 'ignore' is deprecated
        ignore_paths: 'source/go-backend/vendor'
        severity: warning
