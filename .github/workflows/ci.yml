name: M3TAL Control Plane CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-go-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./source/go-backend
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    - name: Go Format
      run: go fmt ./...
    - name: Go Vet
      run: go vet ./...
    - name: Go Build
      run: go build ./...

  test-python-cli:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r source/dashboard/requirements.txt
    - name: Verify CLI script
      run: python m3tal.py --help
    - name: Verify CLI Init dry run
      run: python m3tal.py init --help

  test-python-cli-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r source/dashboard/requirements.txt
    - name: Verify CLI script on Windows
      run: python m3tal.py --help

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install Lint Tools
      run: pip install flake8
    - name: Lint — syntax errors and undefined names
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Lint — style warnings
      run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Lint shell scripts
      uses: ludeeus/action-shellcheck@master
      with:
        scandir: '.'
        severity: warning
