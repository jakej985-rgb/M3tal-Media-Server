name: EXE Test Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  exe-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build EXE
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -o dist/m3tal.exe ./cmd/m3tal
