name: Build and Publish

on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Unique Version
        id: check_version
        run: |
          git fetch --tags
          VERSION=$(cat VERSION)
          
          if git tag -l | grep -q "^${VERSION}$"; then
            echo "⚠️ Tag $VERSION already exists! Auto-bumping patch version..."
            BASE=$(echo "$VERSION" | cut -d. -f1,2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="${BASE}.${NEW_PATCH}"
            
            echo "✅ Bumping to $NEW_VERSION"
            echo "$NEW_VERSION" > VERSION
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add VERSION
            git commit -m "chore: auto-bump version to $NEW_VERSION [skip ci]"
            git push origin HEAD:main
            
            VERSION=$NEW_VERSION
          fi
          
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils gnupg2

      - name: Build .deb package
        run: ./scripts/build-deb.sh

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Update APT Repository
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./scripts/update-repo.sh

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
          force_orphan: false

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.deb"
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
