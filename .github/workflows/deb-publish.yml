name: DEB Publish

on:
  workflow_dispatch:

jobs:
  deb-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Set Version
        run: echo "VERSION=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

      - name: Build Binaries
        run: |
          go build -ldflags="-s -w" -o ./m3tal ./cmd/m3tal
          go build -ldflags="-s -w" -o ./m3tal-api ./cmd/api

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Build .deb
        run: nfpm package --packager deb --config packaging/nfpm.yaml --target dist/

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
