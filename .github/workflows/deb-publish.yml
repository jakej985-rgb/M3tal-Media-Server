name: DEB Publish

on:
  workflow_dispatch:

jobs:
  deb-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: false

      - name: Set Version
        run: echo "VERSION=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

      - name: Build Binaries
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o ./m3tal ./cmd/m3tal
          go build -ldflags="-s -w" -o ./m3tal-api ./cmd/api

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Build .deb
        run: nfpm package --packager deb --config packaging/nfpm.yaml --target dist/m3tal-core.deb

      - name: Install aptly
        run: |
          sudo apt-get update
          sudo apt-get install -y aptly

      - name: Import GPG Key
        run: |
          printf "%s" "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --batch --yes
          # Verify the key is present
          gpg --list-secret-keys

      - name: Trust GPG Key
        run: |
          # This avoids "key is not trusted" warnings during signing
          echo -e "5\ny\n" | gpg --batch --command-fd 0 --expert --edit-key "${{ secrets.GPG_KEY_ID }}" trust

      - name: Build APT Repository
        run: |
          # Create the repo if it doesn't exist
          aptly repo create -distribution=stable -component=main m3tal || true
          
          # Add the newly built .deb
          aptly repo add m3tal dist/m3tal-core.deb
          
          # Publish (or update) the repo with loopback pinentry
          if aptly publish list | grep -q "stable"; then
            aptly publish update \
              -gpg-key="${{ secrets.GPG_KEY_ID }}" \
              -passphrase="${{ secrets.GPG_PASSPHRASE }}" \
              -batch \
              -gpg-options="--pinentry-mode=loopback" \
              stable
          else
            aptly publish repo \
              -gpg-key="${{ secrets.GPG_KEY_ID }}" \
              -passphrase="${{ secrets.GPG_PASSPHRASE }}" \
              -batch \
              -gpg-options="--pinentry-mode=loopback" \
              -distribution=stable \
              m3tal
          fi

      - name: Prepare GH-Pages Directory
        run: |
          mkdir -p public
          cp -r ~/.aptly/public/* public/
          cp m3tal.gpg public/
          cp install.sh public/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true

      - name: Publish Release (Artifacts)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
