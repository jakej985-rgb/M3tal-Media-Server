name: DEB Publish

on:
  workflow_dispatch:

jobs:
  deb-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set Version
        run: echo "VERSION=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

      - name: Build Binary
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/m3tal ./cmd/m3tal

      - name: Install nfpm
        run: |
          curl -sL https://github.com/goreleaser/nfpm/releases/latest/download/nfpm_$(uname -s)_$(uname -m).tar.gz | tar -xz
          sudo mv nfpm /usr/local/bin/

      - name: Create nfpm config
        run: |
          cat <<EOF > nfpm.yaml
          name: m3tal-core
          arch: amd64
          platform: linux
          version: ${VERSION}
          maintainer: Jake Johnson
          description: M3tal Core CLI
          contents:
            - src: ./dist/m3tal
              dst: /usr/bin/m3tal
          EOF

      - name: Build .deb
        run: nfpm package --config nfpm.yaml --target dist/

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
