name: EXE Publish

on:
  workflow_dispatch:

jobs:
  exe-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: false

      - name: Build EXE
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/m3tal.exe ./cmd/m3tal

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: dist/m3tal.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
