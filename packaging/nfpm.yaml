name: m3tal
arch: amd64
platform: linux
version: ${VERSION}

section: utils
priority: optional
maintainer: Jake Johnson <jake@m3tal.io>
description: |
  M3TAL Core — DEB-first infrastructure orchestration platform.
  Includes the m3tal CLI and control-plane API.
  Optimized for Traefik ecosystems and home lab automation.
license: MIT

contents:
  # Binaries
  - src: ./m3tal
    dst: /usr/bin/m3tal
    type: "file"

  - src: ./m3tal-api
    dst: /usr/bin/m3tal-api
    type: "file"

  # Configuration Templates
  - src: ./.env.example
    dst: /etc/m3tal/.env.example
    type: "config"

  # Stack Templates (source of truth for /opt/m3tal/stack)
  - src: ./deploy/stack/
    dst: /usr/share/m3tal/stack/

  # Systemd Services
  - src: ./packaging/m3tal-api.service
    dst: /lib/systemd/system/m3tal-api.service
    type: "config"

scripts:
  postinstall: ./scripts/postinstall.sh
  postremove: ./scripts/postremove.sh