name: m3tal-core
arch: amd64
platform: linux
version: ${VERSION}

section: utils
priority: optional
maintainer: Jake Johnson
description: Lightweight M3tal Core CLI
license: MIT

contents:
  - src: ./dist/m3tal
    dst: /usr/bin/m3tal

  - src: ./source/m3tal-stack/*.yml
    dst: /usr/share/m3tal/stack/

  - src: ./source/m3tal-stack/users.json
    dst: /usr/share/m3tal/stack/users.json

scripts:
  postinstall: ./scripts/postinstall.sh
