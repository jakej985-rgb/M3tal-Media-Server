name: m3tal-core
arch: amd64
platform: linux
version: ${VERSION}

section: utils
priority: optional
maintainer: Jake Johnson
description: |
  M3TAL Core — Lightweight orchestration platform.
  Includes CLI (m3tal) and API backend (m3tal-api).
  GUI dashboard available as separate Docker image.
license: MIT

contents:
  # CLI & API binaries
  - src: ./m3tal
    dst: /usr/bin/m3tal

  - src: ./m3tal-api
    dst: /usr/bin/m3tal-api

  # Systemd service files
  - src: ./packaging/m3tal.service
    dst: /lib/systemd/system/m3tal.service

  - src: ./packaging/m3tal-api.service
    dst: /lib/systemd/system/m3tal-api.service


  # Default configuration
  - src: ./packaging/config.yaml
    dst: /etc/m3tal/config.yaml
    type: config

scripts:
  postinstall: ./scripts/postinstall.sh
  postremove: ./scripts/postremove.sh